<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地 Qwen2.5-3B 聊天</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232563EB'/%3E%3Cpath d='M12 5c-3.9 0-7 2.4-7 5.5 0 1.9 1.2 3.6 3 4.6V18l2.6-1.6c.45.07.93.1 1.4.1 3.9 0 7-2.4 7-5.5S15.9 5 12 5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#121212;--panel:#1E1E1E;--border:#333;--text:#ECECEC;--text-2:#9AA3B2;--text-3:#6B7280;
  --accent:#2563EB;--accent-strong:#1D4ED8;--user:#2563EB;--danger:#D64545;--ok:#22C55E;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
textarea,input{font-family:inherit;color:inherit}
.app{max-width:860px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}
@media(min-width:768px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}

/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);z-index:10;flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563EB,#60A5FA);display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.brand h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap}
.status-line{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);white-space:nowrap}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex:none}
.status-dot.ok{background:var(--ok)}
.status-dot.err{background:var(--danger)}
.top-actions{display:flex;align-items:center;gap:10px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s}
.icon-btn:hover{background:#2A2A2A}
.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ===== 模式开关 ===== */
.mode-toggle{display:flex;align-items:center;gap:2px;background:#2A2A2A;border-radius:999px;padding:3px;flex:none}
.mode-toggle button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:12px;color:var(--text-2);font-weight:600;transition:background .15s,color .15s;white-space:nowrap;min-height:28px}
.mode-toggle button.on{background:var(--accent);color:#fff}

/* ===== 对话区 ===== */
.chat{flex:1;overflow-y:auto;padding:18px 14px 10px}
.msg{display:flex;gap:10px;margin-bottom:18px;animation:rise .18s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:2px;font-size:14px}
.avatar.ai{background:linear-gradient(135deg,#2563EB,#60A5FA);color:#fff}
.avatar.user{background:#2A2A2A;color:var(--text-2)}
.msg-body{max-width:84%;min-width:0}
.bubble{max-width:100%;padding:10px 14px;border-radius:16px;font-size:15px;word-break:break-word}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .bubble{background:var(--user);color:#fff;border-top-right-radius:5px}
.msg.ai .bubble{background:var(--panel);border:1px solid var(--border);border-top-left-radius:5px}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble h1,.bubble h2,.bubble h3,.bubble h4{margin:10px 0 6px;line-height:1.4;font-size:1.05em}
.bubble ul,.bubble ol{margin:6px 0;padding-left:20px}
.bubble li{margin:3px 0}
.bubble blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--text-2);background:#262626;border-radius:0 8px 8px 0}
.bubble code{background:#2A2A2A;padding:1px 6px;border-radius:6px;font-size:.88em;font-family:Consolas,"Courier New",monospace}
.bubble pre{background:#0D0D0D;color:#E6EBF5;padding:12px 14px;border-radius:12px;overflow-x:auto;font-size:13px;line-height:1.55;font-family:Consolas,"Courier New",monospace;margin:8px 0}
.bubble pre code{background:none;padding:0}
.bubble a{color:#60A5FA;text-decoration:none}
.msg.user .bubble a{color:#fff;text-decoration:underline}
.msg-extra{margin-top:6px;display:flex;gap:6px}
.copy-btn{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3);padding:5px 9px;border-radius:8px}
.copy-btn:hover{background:#2A2A2A;color:var(--text-2)}
.thinking{display:inline-flex;align-items:center;gap:8px;color:var(--text-3);font-size:13px;padding:2px 0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);display:inline-block;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s infinite}

/* ===== 空态 ===== */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 18px;color:var(--text-2)}
.ring{width:76px;height:76px;border-radius:24px;background:#1A2A4A;display:flex;align-items:center;justify-content:center;margin-bottom:18px;color:var(--accent)}
.empty h2{font-size:19px;margin:0 0 8px;color:var(--text)}
.empty>p{max-width:440px;margin:0 0 16px;font-size:14px}
.steps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}
.step{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px;max-width:250px;text-align:left;line-height:1.55}
.step b{display:block;color:var(--accent);font-size:12px;margin-bottom:3px}

/* ===== 输入区 ===== */
.composer{background:var(--panel);border:1px solid var(--border);border-radius:18px;margin:0 14px 14px;padding:10px 12px;flex:none}
.composer textarea{width:100%;border:none;outline:none;resize:none;font-size:16px;line-height:1.5;background:transparent;max-height:160px;min-height:24px;padding:2px 0;color:var(--text)}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.composer-hint{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.send-btn{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s,opacity .15s;flex:none}
.send-btn:hover{background:var(--accent-strong)}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
.send-btn.stop{background:#2A2A2A;color:var(--text-2)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:#1B2333;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;line-height:1.5;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--danger)}
.toast.ok{background:#1F7A4D}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
      <div style="min-width:0">
        <h1>本地 Qwen2.5-3B 聊天</h1>
        <div class="status-line"><span class="status-dot" id="statusDot"></span><span id="statusText">正在检查本地服务…</span></div>
      </div>
    </div>
    <div class="top-actions">
      <div class="mode-toggle" id="modeToggle" role="group" aria-label="对话模式">
        <button type="button" data-mode="normal" class="on">普通</button>
        <button type="button" data-mode="think">深度思考</button>
      </div>
      <button class="icon-btn" id="clearBtn" title="清空对话" aria-label="清空对话"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
    </div>
  </header>

  <main class="chat" id="chat"></main>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <div class="composer-row">
      <span class="composer-hint" id="providerHint">qwen2.5:3b · 本地免费 · 无需 Key</span>
      <button class="send-btn" id="sendBtn" aria-label="发送"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';
/* ========== 配置 ========== */
var BASE_URL='http://127.0.0.1:11434/v1';
var MODEL='qwen2.5:3b';
var SYSTEM_BASE='你是一个严谨、清晰的中文 AI 助手，基于 Qwen2.5-3B 本地运行。回答规范：1. 先准确理解问题再作答，不臆测、不编造；不确定时明确说明。2. 先给结论，再给必要解释；复杂问题分点说明。3. 语言简洁准确，避免空话、套话和重复。4. 数学与编程问题给出可验证、可运行的答案并简要说明思路。5. 默认使用简体中文。';
var SYSTEM_THINK=SYSTEM_BASE+' 当用户开启深度思考模式时，请先输出“【思考过程】”：拆解问题、明确目标与约束、逐步推理、检查边界与逻辑漏洞；再输出“【最终答案】”：给出简洁、准确、结构清晰的结论，且【最终答案】应独立可读。';

var chatEl=$('chat'),inputEl=$('input'),sendBtn=$('sendBtn'),clearBtn=$('clearBtn'),hintEl=$('providerHint');
var statusDot=$('statusDot'),statusText=$('statusText');
var settings={thinkMode:false};
var messages=loadJSON('qwenLocal.messages',[]);
var streaming=false,abortCtrl=null;

function $(id){return document.getElementById(id);}

/* ========== 状态检查 ========== */
function checkServer(){
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ctrl.abort();},4000);
  fetch(BASE_URL+'/models',{signal:ctrl.signal}).then(function(r){
    clearTimeout(timer);
    if(r.ok){
      statusDot.className='status-dot ok';
      statusText.textContent='本地服务已连接';
    }else{
      statusDot.className='status-dot err';
      statusText.textContent='服务异常（HTTP '+r.status+'）';
    }
  }).catch(function(){
    clearTimeout(timer);
    statusDot.className='status-dot err';
    statusText.textContent='未连接：请先运行 start.bat';
  });
}

/* ========== 消息渲染 ========== */
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function renderMarkdown(src){
  var esc=escapeHtml(src);
  var blocks=esc.split(/\n{2,}/);
  var out='';
  blocks.forEach(function(b){
    b=b.replace(/\n/g,'\n');
    if(/^```/.test(b)){
      var lines=b.split('\n');
      lines.shift();
      if(lines.length&&/^```/.test(lines[lines.length-1]))lines.pop();
      out+='<pre><code>'+lines.join('\n')+'</code></pre>';
      return;
    }
    if(/^#/.test(b)){
      var m=b.match(/^(#{1,4})\s+(.+)$/m);
      if(m){var n=m[1].length;out+='<h'+n+'>'+inline(m[2])+'</h'+n+'>';return;}
    }
    if(/^[>-]\s/.test(b)||/^\d+\.\s/.test(b)){
      var li=b.split('\n').map(function(l){return '<li>'+inline(l.replace(/^[>-]\s+/,'').replace(/^\d+\.\s+/,''))+'</li>';}).join('');
      out+='<ul>'+li+'</ul>';
      return;
    }
    if(/^&gt;/.test(b)){
      out+='<blockquote>'+inline(b.replace(/^&gt;\s?/,''))+'</blockquote>';
      return;
    }
    out+='<p>'+inline(b.replace(/\n/g,'<br>'))+'</p>';
  });
  return out;
}
function inline(s){
  return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/\*([^*\n]+)\*/g,'<em>$1</em>')
          .replace(/`([^`]+)`/g,'<code>$1</code>');
}

function addMessage(role,text){
  var wrap=document.createElement('div');
  wrap.className='msg '+role;
  var avatar=document.createElement('div');
  avatar.className='avatar '+role;
  avatar.textContent=role==='user'?'我':'AI';
  var body=document.createElement('div');
  body.className='msg-body';
  var bubble=document.createElement('div');
  bubble.className='bubble';
  if(role==='assistant'){
    bubble.innerHTML=text?renderMarkdown(text):'<span class="thinking"><span class="dot"></span><span class="dot"></span><span class="dot"></span> 思考中…</span>';
  }else{
    bubble.textContent=text;
  }
  body.appendChild(bubble);
  if(role==='assistant'&&text){
    var extra=document.createElement('div');
    extra.className='msg-extra';
    extra.appendChild(copyBtn(text));
    body.appendChild(extra);
  }
  wrap.appendChild(avatar);
  wrap.appendChild(body);
  chatEl.appendChild(wrap);
  chatEl.scrollTop=chatEl.scrollHeight;
  return {wrap:wrap,bubble:bubble,body:body};
}
function copyBtn(text){
  var b=document.createElement('button');
  b.className='copy-btn';
  b.textContent='复制';
  b.addEventListener('click',function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){toast('已复制','ok');}).catch(function(){fallbackCopy(text);});
    }else{fallbackCopy(text);}
  });
  return b;
}
function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制','ok');}catch(e){toast('复制失败，请手动选择','err');}
  document.body.removeChild(ta);
}

function renderAll(){
  chatEl.innerHTML='';
  if(!messages.length){renderEmpty();return;}
  messages.forEach(function(m){addMessage(m.role,m.content);});
}
function renderEmpty(){
  chatEl.innerHTML='';
  var e=document.createElement('div');
  e.className='empty';
  e.innerHTML='<div class="ring"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>'
    +'<h2>开始你的本地 AI 对话</h2>'
    +'<p>Qwen2.5-3B 完全在本地运行，无需 Key、无需联网，数据不出本机。</p>'
    +'<div class="steps">'
    +'<div class="step"><b>固定模型</b>仅使用 qwen2.5:3b，无切换选项，开箱即用</div>'
    +'<div class="step"><b>深度思考</b>顶部开关开启后，AI 会先推理再作答</div>'
    +'<div class="step"><b>隐私</b>对话记录只保存在浏览器本地</div>'
    +'</div>';
  chatEl.appendChild(e);
}

/* ========== 发送 ========== */
function updateSendBtn(){
  sendBtn.disabled=streaming||!inputEl.value.trim();
  sendBtn.classList.toggle('stop',streaming);
  sendBtn.innerHTML=streaming
    ?'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>'
    :'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>';
}

function send(){
  var text=inputEl.value.trim();
  if(!text||streaming)return;
  messages.push({role:'user',content:text});
  saveJSON('qwenLocal.messages',messages);
  renderAll();
  messages.push({role:'assistant',content:''});
  var node=addMessage('assistant','');
  streaming=true;updateSendBtn();
  abortCtrl=new AbortController();
  var apiMessages=[{role:'system',content:settings.thinkMode?SYSTEM_THINK:SYSTEM_BASE}]
    .concat(messages.slice(0,messages.length-1).map(function(m){return {role:m.role,content:m.content};}));
  streamChat(apiMessages).then(function(){
    finalize(node);
  }).catch(function(err){
    if(err&&err.name==='AbortError'){finalize(node);}
    else{handleError(node,err);}
  }).then(function(){
    streaming=false;abortCtrl=null;updateSendBtn();
    var last=messages[messages.length-1];
    if(last&&last.role==='assistant'&&!last.content.trim()){messages.pop();renderAll();}
    saveJSON('qwenLocal.messages',messages);
    scrollBottom();
    inputEl.focus();
  });
}

function streamChat(apiMessages){
  var payload={model:MODEL,messages:apiMessages,stream:true,temperature:settings.thinkMode?0.5:0.7,
               max_tokens:settings.thinkMode?1400:800};
  return fetch(BASE_URL+'/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload),
    signal:abortCtrl.signal
  }).then(function(resp){
    if(!resp.ok){
      return resp.json().then(function(j){
        var msg='请求失败（HTTP '+resp.status+'）';
        if(j&&j.error){msg=typeof j.error==='string'?j.error:(j.error.message||msg);}
        throw new Error(msg);
      }).catch(function(e){
        if(e instanceof Error&&e.message.indexOf('请求失败')===0)throw e;
        throw new Error('请求失败（HTTP '+resp.status+'）');
      });
    }
    var reader=resp.body.getReader();
    var decoder=new TextDecoder();
    var buffer='';
    function pump(){
      return reader.read().then(function(res){
        if(res.done)return;
        buffer+=decoder.decode(res.value,{stream:true});
        var nl;
        while((nl=buffer.indexOf('\n'))!==-1){
          var line=buffer.slice(0,nl).trim();
          buffer=buffer.slice(nl+1);
          if(line.indexOf('data:')!==0)continue;
          var data=line.slice(5).trim();
          if(data==='[DONE]')return;
          try{
            var j=JSON.parse(data);
            var delta=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
            if(delta)appendDelta(delta);
          }catch(e){}
        }
        return pump();
      });
    }
    return pump();
  });
}

function appendDelta(d){
  var last=messages[messages.length-1];
  last.content+=d;
  var node=findLastAi();
  if(node){node.bubble.innerHTML=renderMarkdown(last.content)+'<span class="caret"></span>';scrollBottom();}
}
function findLastAi(){
  var rows=chatEl.querySelectorAll('.msg.ai');
  return rows.length?{bubble:rows[rows.length-1].querySelector('.bubble')}:null;
}
function finalize(node){
  var last=messages[messages.length-1];
  if(node){
    node.bubble.innerHTML=last.content?renderMarkdown(last.content):'<span style="color:var(--text-3)">（无回复内容）</span>';
    if(last.content&&!node.body.querySelector('.msg-extra')){
      var extra=document.createElement('div');
      extra.className='msg-extra';
      extra.appendChild(copyBtn(last.content));
      node.body.appendChild(extra);
    }
  }
}
function handleError(node,err){
  var msg=err&&err.message?err.message:'网络错误';
  if(/Failed to fetch|NetworkError|Load failed|CORS|fetch/i.test(msg)){
    msg='无法连接本地服务：请先运行 start.bat 启动 Ollama，并确认 127.0.0.1:11434 未被占用。';
  }
  var last=messages[messages.length-1];
  if(last&&last.role==='assistant'){last.content='出错了：'+msg;}
  else{messages.push({role:'assistant',content:'出错了：'+msg});}
  finalize(node);
}
function stopStream(){if(abortCtrl){abortCtrl.abort();}}

/* ========== 模式开关 ========== */
function setMode(mode){
  settings.thinkMode=(mode==='think');
  var btns=document.querySelectorAll('#modeToggle button');
  for(var i=0;i<btns.length;i++){btns[i].classList.toggle('on',btns[i].dataset.mode===mode);}
  hintEl.textContent='qwen2.5:3b · '+(settings.thinkMode?'深度思考':'普通')+' · 本地免费';
  toast(settings.thinkMode?'已开启深度思考：AI 会先推理再作答':'已切换普通模式','ok');
}

/* ========== 工具 ========== */
function toast(msg,type){
  var t=$('toast');
  t.textContent=msg;
  t.className='toast '+(type||'')+' show';
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.className='toast';},2400);
}
function loadJSON(k,def){
  try{var v=localStorage.getItem(k);if(!v)return def;var j=JSON.parse(v);return typeof j==='object'&&j?j:def;}catch(e){return def;}
}
function saveJSON(k,v){
  try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}
}
function scrollBottom(){chatEl.scrollTop=chatEl.scrollHeight;}

/* ========== 初始化 ========== */
renderAll();
updateSendBtn();
checkServer();
inputEl.addEventListener('input',function(){
  updateSendBtn();
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,160)+'px';
});
inputEl.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
});
sendBtn.addEventListener('click',function(){if(streaming){stopStream();}else{send();}});
clearBtn.addEventListener('click',function(){
  if(streaming)stopStream();
  messages=[];saveJSON('qwenLocal.messages',[]);renderAll();toast('已清空对话','ok');
});
var modeBtns=document.querySelectorAll('#modeToggle button');
for(var mi=0;mi<modeBtns.length;mi++){
  (function(b){b.addEventListener('click',function(){setMode(b.dataset.mode);});})(modeBtns[mi]);
}
</script>
